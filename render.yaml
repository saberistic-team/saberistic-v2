# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

previews:
  generation: off

projects:
  - name: saberistic-platform
    environments:
      - name: staging
        networking:
          isolation: disabled
        permissions:
          protection: disabled
        services:
          - type: web
            name: saberistic-web-staging
            runtime: docker
            plan: free
            region: ohio
            dockerfilePath: ./Dockerfile
            dockerContext: .
            healthCheckPath: /api/ready
            autoDeployTrigger: checksPass
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: saberistic-payload-db-staging
                  property: connectionString
              - key: PAYLOAD_SECRET
                generateValue: true
              - key: SITE_URL
                value: https://saberistic.com
              - key: SEED_PUBLIC_CONCEPTS
                value: 'false'

        databases:
          - name: saberistic-payload-db-staging
            plan: free
            region: ohio
            databaseName: saberistic_v2_staging
            user: saberistic
            postgresMajorVersion: '18'
            ipAllowList: []
