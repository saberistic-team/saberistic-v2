# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

previews:
  generation: off

projects:
  - name: saberistic-platform
    environments:
      - name: staging
        networking:
          isolation: disabled
        permissions:
          protection: disabled
        services:
          - type: web
            name: saberistic-web-staging
            runtime: docker
            plan: free
            region: ohio
            dockerfilePath: ./Dockerfile
            dockerContext: .
            healthCheckPath: /api/ready
            autoDeployTrigger: checksPass
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: saberistic-payload-db-staging
                  property: connectionString
              - key: PAYLOAD_SECRET
                generateValue: true
              - key: SITE_URL
                value: https://saberistic-web-staging.onrender.com
              - key: PUBLIC_SITE_URL
                value: https://saberistic.com
              - key: SEED_PUBLIC_CONCEPTS
                value: 'false'
              - key: UMAMI_SCRIPT_URL
                value: https://umami.saberistic.com/script.js
              - key: UMAMI_WEBSITE_ID
                value: 8bdad921-34a9-43cb-bc70-9e1c71efa911
              - key: UMAMI_TRACK_DOMAINS
                value: saberistic.com,www.saberistic.com

          - type: web
            name: saberistic-site-staging
            runtime: static
            autoDeployTrigger: checksPass
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:site
            staticPublishPath: ./apps/site/out
            envVars:
              - key: PAYLOAD_PUBLIC_URL
                value: https://saberistic-web-staging.onrender.com
              - key: PUBLIC_SITE_URL
                value: https://saberistic.com
              - key: STATIC_CONTENT_MODE
                value: remote
              - key: UMAMI_SCRIPT_URL
                value: https://umami.saberistic.com/script.js
              - key: UMAMI_WEBSITE_ID
                value: 8bdad921-34a9-43cb-bc70-9e1c71efa911
              - key: UMAMI_TRACK_DOMAINS
                value: saberistic.com,www.saberistic.com
            headers:
              - path: /*
                name: Content-Security-Policy
                value: "default-src 'self'; base-uri 'self'; connect-src 'self' https://umami.saberistic.com; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline' https://umami.saberistic.com; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests"
              - path: /*
                name: Permissions-Policy
                value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /_next/static/*
                name: Cache-Control
                value: public, max-age=31536000, immutable
            routes:
              - type: redirect
                source: /admin
                destination: https://saberistic-web-staging.onrender.com/admin
              - type: redirect
                source: /admin/*
                destination: https://saberistic-web-staging.onrender.com/admin/*
              - type: redirect
                source: /api/*
                destination: https://saberistic-web-staging.onrender.com/api/*

          - type: web
            name: saberistic-umami-staging
            runtime: docker
            plan: free
            region: ohio
            dockerfilePath: ./ops/umami/Dockerfile
            dockerContext: .
            healthCheckPath: /api/heartbeat
            domains:
              - umami.saberistic.com
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - ops/umami/**
            envVars:
              - key: UMAMI_DATABASE_ADMIN_URL
                fromDatabase:
                  name: saberistic-payload-db-staging
                  property: connectionString
              - key: UMAMI_DATABASE_PASSWORD
                generateValue: true
              - key: UMAMI_ADMIN_PASSWORD
                generateValue: true
              - key: UMAMI_DATABASE_SCHEMA
                value: umami
              - key: APP_SECRET
                generateValue: true
              - key: UMAMI_TWO_FACTOR_SEED
                generateValue: true
              - key: HOSTNAME
                value: 0.0.0.0
              - key: PORT
                value: '3000'
              - key: DISABLE_TELEMETRY
                value: '1'
              - key: PRIVATE_MODE
                value: '1'
              - key: DISABLE_UPDATES
                value: '1'
              - key: SALT_ROTATION
                value: month

        databases:
          - name: saberistic-payload-db-staging
            plan: free
            region: ohio
            databaseName: saberistic_v2_staging
            user: saberistic
            postgresMajorVersion: '18'
            ipAllowList: []
