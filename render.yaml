# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

previews:
  generation: off

projects:
  - name: saberistic-platform
    environments:
      - name: staging
        networking:
          isolation: disabled
        permissions:
          protection: disabled
        services:
          - type: web
            name: saberistic-web-staging
            runtime: docker
            plan: free
            region: ohio
            dockerfilePath: ./Dockerfile
            dockerContext: .
            healthCheckPath: /api/ready
            autoDeployTrigger: checksPass
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: saberistic-payload-db-staging
                  property: connectionString
              - key: PAYLOAD_SECRET
                generateValue: true
              - key: SITE_URL
                value: https://saberistic-web-staging.onrender.com
              - key: PUBLIC_SITE_URL
                value: https://saberistic.com
              - key: STATIC_SITE_DEPLOY_HOOK_URL
                sync: false
              - key: SEED_PUBLIC_CONCEPTS
                value: 'false'
              - key: UMAMI_SCRIPT_URL
                value: https://umami.saberistic.com/script.js
              - key: UMAMI_WEBSITE_ID
                value: 8bdad921-34a9-43cb-bc70-9e1c71efa911
              - key: UMAMI_TRACK_DOMAINS
                value: saberistic.com,www.saberistic.com
              - key: REDIS_URL
                fromService:
                  name: saberistic-readiness-limits-staging
                  type: keyvalue
                  property: connectionString
              - key: READINESS_RATE_LIMIT_SECRET
                generateValue: true
              - key: GIFTING_RATE_LIMIT_SECRET
                generateValue: true
              - key: GIFT_QUOTE_SECRET
                generateValue: true
              - key: GIFT_QUOTE_TTL_SECONDS
                value: '7200'
              - key: DIAGNOSTIC_RATE_LIMIT_SECRET
                generateValue: true
              - key: READINESS_HANDOFF_SECRET
                generateValue: true
              - key: READINESS_HANDOFF_TOKEN_TTL_SECONDS
                value: '1800'
              - key: OPENROUTER_API_KEY
                sync: false
              - key: OPENROUTER_ACCOUNT_GATES_CONFIRMED
                sync: false
              - key: OPENROUTER_PRIMARY_MODEL
                sync: false
              - key: OPENROUTER_FALLBACK_MODEL
                sync: false
              - key: OPENROUTER_GIFT_PRIMARY_MODEL
                sync: false
              - key: OPENROUTER_GIFT_FALLBACK_MODEL
                sync: false
              - key: OPENROUTER_GIFT_INVENTORY_MODEL
                sync: false
              - key: OPENROUTER_GIFT_IMAGE_MODEL
                sync: false
              - key: OPENROUTER_GIFT_IMAGE_PROVIDER
                value: google-vertex/global
              - key: STRIPE_RESTRICTED_KEY
                sync: false
              - key: STRIPE_GIFT_WEBHOOK_SECRET
                sync: false
              - key: STRIPE_DIAGNOSTIC_RESTRICTED_KEY
                sync: false
              - key: STRIPE_DIAGNOSTIC_WEBHOOK_SECRET
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: RESEND_FROM_ADDRESS
                sync: false
              - key: DIAGNOSTIC_BOOKING_URL
                sync: false
              - key: AI_ENHANCEMENT_ENABLED
                value: '1'
              - key: GIFTING_AI_ENABLED
                value: '0'
              - key: GIFTING_CHECKOUT_ENABLED
                value: '0'
              - key: DIAGNOSTIC_ENABLED
                value: '0'
              - key: OPENROUTER_TIMEOUT_MS
                value: '12000'
              - key: OPENROUTER_MAX_COMPLETION_TOKENS
                value: '1800'
              - key: READINESS_AI_IP_LIMIT
                value: '8'
              - key: READINESS_AI_TOKEN_LIMIT
                value: '4'
              - key: READINESS_AI_DAILY_LIMIT
                value: '200'
              - key: READINESS_AI_CONCURRENCY_LIMIT
                value: '3'
              - key: READINESS_REJECT_IP_LIMIT
                value: '4'
              - key: READINESS_REJECT_IP_WINDOW_SECONDS
                value: '3600'
              - key: OPENROUTER_GIFT_TIMEOUT_MS
                value: '20000'
              - key: OPENROUTER_GIFT_IMAGE_TIMEOUT_MS
                value: '60000'
              - key: GIFT_INVENTORY_JOB_TIMEOUT_MS
                value: '120000'
              - key: OPENROUTER_GIFT_MAX_COMPLETION_TOKENS
                value: '3000'
              - key: GIFTING_IP_LIMIT
                value: '8'
              - key: GIFTING_TOKEN_LIMIT
                value: '4'
              - key: GIFTING_DAILY_LIMIT
                value: '500'
              - key: GIFT_INVENTORY_DAILY_DISCOVERY_LIMIT
                value: '48'
              - key: GIFTING_CONCURRENCY_LIMIT
                value: '2'
              - key: GIFTING_CHECKOUT_IP_LIMIT
                value: '20'
              - key: GIFTING_CHECKOUT_QUOTE_LIMIT
                value: '5'
              - key: GIFTING_STATUS_IP_LIMIT
                value: '30'
              - key: DIAGNOSTIC_IP_LIMIT
                value: '5'
              - key: DIAGNOSTIC_TOKEN_LIMIT
                value: '3'
              - key: DIAGNOSTIC_DAILY_LIMIT
                value: '100'

          - type: web
            name: saberistic-site-staging
            runtime: static
            domains:
              - saberistic.com
            renderSubdomainPolicy: disabled
            autoDeployTrigger: checksPass
            buildCommand: pnpm build:site
            staticPublishPath: ./apps/site/out
            envVars:
              - key: PAYLOAD_PUBLIC_URL
                value: https://saberistic-web-staging.onrender.com
              - key: PUBLIC_SITE_URL
                value: https://saberistic.com
              - key: STATIC_CONTENT_MODE
                value: remote
              - key: UMAMI_SCRIPT_URL
                value: https://umami.saberistic.com/script.js
              - key: UMAMI_WEBSITE_ID
                value: 8bdad921-34a9-43cb-bc70-9e1c71efa911
              - key: UMAMI_TRACK_DOMAINS
                value: saberistic.com,www.saberistic.com
            headers:
              - path: /*
                name: Content-Security-Policy
                value: "default-src 'self'; base-uri 'self'; connect-src 'self' https://saberistic-web-staging.onrender.com https://umami.saberistic.com; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https://saberistic-web-staging.onrender.com; media-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://umami.saberistic.com; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests"
              - path: /*
                name: Permissions-Policy
                value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /_next/static/*
                name: Cache-Control
                value: public, max-age=31536000, immutable
              - path: /brand/*
                name: Cache-Control
                value: public, max-age=86400, stale-while-revalidate=604800
              - path: /media/*
                name: Cache-Control
                value: public, max-age=31536000, immutable
            routes:
              - type: redirect
                source: /about
                destination: '/#about'
              - type: redirect
                source: /services
                destination: '/#services'
              - type: redirect
                source: /case-studies
                destination: '/#work'
              - type: redirect
                source: /brief
                destination: '/readiness/?next=architecture-diagnostic'
              - type: redirect
                source: /diagnostic
                destination: '/readiness/?next=architecture-diagnostic'
              - type: redirect
                source: /work/architecture-diagnostic
                destination: '/readiness/?next=architecture-diagnostic'
              - type: redirect
                source: /work/brave
                destination: '/#work'
              - type: redirect
                source: /work/baxus
                destination: '/#work'
              - type: redirect
                source: /work/eternis
                destination: '/#work'
              - type: redirect
                source: /admin
                destination: https://saberistic-web-staging.onrender.com/admin
              - type: redirect
                source: /admin/*
                destination: https://saberistic-web-staging.onrender.com/admin/*
              - type: redirect
                source: /api/*
                destination: https://saberistic-web-staging.onrender.com/api/*

          - type: web
            name: saberistic-umami-staging
            runtime: docker
            plan: free
            region: ohio
            dockerfilePath: ./ops/umami/Dockerfile
            dockerContext: .
            healthCheckPath: /api/heartbeat
            domains:
              - umami.saberistic.com
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - ops/umami/**
            envVars:
              - key: UMAMI_DATABASE_ADMIN_URL
                fromDatabase:
                  name: saberistic-payload-db-staging
                  property: connectionString
              - key: UMAMI_DATABASE_PASSWORD
                generateValue: true
              - key: UMAMI_ADMIN_PASSWORD
                generateValue: true
              - key: UMAMI_DATABASE_SCHEMA
                value: umami
              - key: APP_SECRET
                generateValue: true
              - key: UMAMI_TWO_FACTOR_SEED
                generateValue: true
              - key: HOSTNAME
                value: 0.0.0.0
              - key: PORT
                value: '3000'
              - key: DISABLE_TELEMETRY
                value: '1'
              - key: PRIVATE_MODE
                value: '1'
              - key: DISABLE_UPDATES
                value: '1'
              - key: SALT_ROTATION
                value: month

          - type: keyvalue
            name: saberistic-readiness-limits-staging
            plan: free
            region: ohio
            maxmemoryPolicy: noeviction
            ipAllowList: []

        databases:
          - name: saberistic-payload-db-staging
            plan: free
            region: ohio
            databaseName: saberistic_v2_staging
            user: saberistic
            postgresMajorVersion: '18'
            ipAllowList: []
